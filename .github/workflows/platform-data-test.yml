name: Platform Data CI

on:
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/platform-data-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-data-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-data:
    name: Install, typecheck, generate and test Source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm' 
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Source Data
        run: npx tsc --noEmit -p tsconfig.json 

      - name: Generate Database
        run: npx drizzle-kit generate 

      - name: Test Connection to Database
        env:
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: ${{ secrets.CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE }}
        run: npx tsx test-db.ts 
