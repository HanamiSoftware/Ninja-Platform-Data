name: Platform Data CI

on:
  pull_request:
    paths:
      - "src/**"
      - "migrations/**"
      - "drizzle.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/platform-data-test.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "migrations/**"
      - "drizzle.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/platform-data-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-data-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, typecheck, generate and test Source
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Source Data
        run: npm run typecheck

      - name: Generate Database
        run: npm run generate

      - name: Upload generated Drizzle artifacts for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drizzle-generated-artifacts
          path: |
            migrations/*.sql
            migrations/meta/*.json
          if-no-files-found: error
          retention-days: 3

      - name: Verify generated schema and migrations are committed
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- src/schema migrations)" ]; then
            echo "::error::Drizzle generation changed schema or migration artifacts. Run npm run generate locally and commit the generated files."
            git status --short -- src/schema migrations
            git diff -- src/schema migrations
            exit 1
          fi

  database-connection:
    name: Test database connectivity (trusted main only)
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test Connection to Database
        env:
          DATABASE_URL: ${{ secrets.CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE }}
        run: npx tsx src/test-db.ts
